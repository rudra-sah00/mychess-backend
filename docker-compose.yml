version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mychess-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://mychess:mychesspassword@postgres:5432/mychessdb?schema=public
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    container_name: mychess-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mychess
      POSTGRES_PASSWORD: mychesspassword
      POSTGRES_DB: mychessdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mychess -d mychessdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mychess-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
